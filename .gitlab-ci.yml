# Required CI/CD variables (Settings > CI/CD > Variables, masked + protected):
#   CYPRESS_adminEmail, CYPRESS_adminPassword
#   CYPRESS_phase2AdminEmail, CYPRESS_phase2AdminPassword
#   CYPRESS_customerEmail, CYPRESS_customerPassword, CYPRESS_customerNewPassword
# Optional: CYPRESS_ENV (default qa), CYPRESS_runPasswordChange=true,
#           CYPRESS_runAccountOnboarding=true (one-shot provisioning, see README)
#
# package-lock.json must be committed: the jobs install with `npm ci`.

stages:
  - lint
  - test

default:
  image:
    # Keep this tag identical to the "cypress" version pinned in package.json.
    name: cypress/included:13.15.1
    entrypoint: ['']
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

variables:
  CYPRESS_ENV: qa
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  # The Cypress binary is already baked into the image.
  CYPRESS_INSTALL_BINARY: '0'

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

lint:
  stage: lint
  script:
    - npm ci
    - npm run lint
    - npm run format:check

e2e:
  stage: test
  parallel:
    matrix:
      - SUITE: [sanity, phase2]
  script:
    - npm ci
    - npx cypress run --browser chrome --spec "cypress/e2e/${SUITE}/**/*.cy.js"
  after_script:
    - npm run report || true
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - cypress/results/html/
      - cypress/screenshots/
    reports:
      junit: cypress/results/junit/*.xml
